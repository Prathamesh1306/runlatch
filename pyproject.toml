[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runlatch"
version = "1.1.1"
description = "Durable, HITL-First Execution Runtime for Autonomous Developer Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Prathamesh Ghatkar", email = "prathameshghatkar54@gmail.com" },
]
keywords = [
    "agents",
    "ai-agents",
    "mcp",
    "hitl",
    "human-in-the-loop",
    "developer-tools",
    "llm",
    "tool-calling",
    "celery",
    "fastapi",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<16.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2,<2.0",
]
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<25.0",
]
observability = [
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
runlatch = "runlatch.runtime.cli.main:app"

[project.urls]
Homepage = "https://github.com/Prathamesh1306/runlatch"
Repository = "https://github.com/Prathamesh1306/runlatch"
Documentation = "https://github.com/Prathamesh1306/runlatch/blob/main/docs/USAGE.md"
Issues = "https://github.com/Prathamesh1306/runlatch/issues"
Changelog = "https://github.com/Prathamesh1306/runlatch/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["runlatch*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
